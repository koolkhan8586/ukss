# Nginx site for Contabo Ubuntu
# Install:
#   sudo cp deploy/nginx/exp.ukssolution.com.conf /etc/nginx/sites-available/exp.ukssolution.com
#   sudo ln -sf /etc/nginx/sites-available/exp.ukssolution.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (after HTTP works):
#   sudo certbot --nginx -d exp.ukssolution.com

upstream ukss_expense_app {
    server 127.0.0.1:3007;
    keepalive 32;
}

# HTTP — used by Cloudflare Flexible, or before certbot
server {
    listen 80;
    listen [::]:80;
    server_name exp.ukssolution.com;

    client_max_body_size 10m;

    access_log /var/log/nginx/exp.ukssolution.com.access.log;
    error_log  /var/log/nginx/exp.ukssolution.com.error.log;

    location / {
        proxy_pass http://ukss_expense_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

