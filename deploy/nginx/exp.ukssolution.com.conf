# Nginx site config for exp.ukssolution.com
# Install path (aaPanel / Contabo):
#   /www/server/panel/vhost/nginx/exp.ukssolution.com.conf
# Or standard nginx:
#   /etc/nginx/sites-available/exp.ukssolution.com
#
# After install:
#   nginx -t && systemctl reload nginx
#   (aaPanel: Website → Reload / Save)

upstream ukss_expense_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name exp.ukssolution.com;

    # Redirect HTTP → HTTPS (Cloudflare Flexible/Full both OK with this)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name exp.ukssolution.com;

    # Replace these with aaPanel-managed cert paths if different
    ssl_certificate     /www/server/panel/vhost/cert/exp.ukssolution.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/exp.ukssolution.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    access_log /www/wwwlogs/exp.ukssolution.com.log;
    error_log  /www/wwwlogs/exp.ukssolution.com.error.log;

    location / {
        proxy_pass http://ukss_expense_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://ukss_expense_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
